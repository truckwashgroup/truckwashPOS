name: Release publiceren

# Zet een versietag en deze workflow bouwt de Windows-installer en de
# Android-APK, en hangt ze onder Releases op GitHub. Daar haalt de
# geïnstalleerde kassa ook zijn updates vandaan.
#
#   npm version 0.1.1 --no-git-tag-version   (past package.json aan)
#   git commit -am "Versie 0.1.1"
#   git tag v0.1.1
#   git push && git push --tags
#
# Losse handmatige start kan ook, via het tabblad Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versie om te publiceren, bijv. v0.1.1'
        required: true

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  #  Controle vooraf: tag en package.json moeten hetzelfde zeggen
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          TAG_CLEAN="${TAG#v}"
          echo "package.json: $PKG"
          echo "tag:          $TAG_CLEAN"
          if [ "$PKG" != "$TAG_CLEAN" ]; then
            echo "::error::De tag ($TAG_CLEAN) komt niet overeen met de versie in package.json ($PKG)."
            echo "::error::Pas package.json aan of zet een andere tag. De updater vergelijkt op package.json."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      #  De release alvast neerzetten, leeg
      # ----------------------------------------------------------------
      #  Niet netjesheid maar een fix. Electron-builder uploadt zijn drie
      #  bestanden parallel en elke upload doet "zoek de release op zijn tag,
      #  maak hem anders aan". Lopen er twee tegelijk, dan maken ze er allebei
      #  een -- en dan staan er TWEE releases onder dezelfde tag. Bij v0.19.1
      #  en v0.19.2 is dat gebeurd: de ene kreeg latest.yml en de installer,
      #  de andere alleen de blockmap.
      #
      #  De APK-stap verderop vindt in die toestand niets bruikbaars meer en
      #  valt om met "Validation Failed: Release already_exists". Zo kwam de
      #  APK bij beide versies niet in de release terecht terwijl hij wel
      #  gewoon gebouwd was.
      #
      #  Bestaat de release al voordat er iets uploadt, dan hoeft niemand hem
      #  nog aan te maken en kan de race niet meer optreden. Bij een herstart
      #  van een gefaalde run is dit ook meteen een no-op.
      - name: Lege release klaarzetten
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Truckwash1 Kassa ${{ steps.v.outputs.version }}
          draft: false

  # ------------------------------------------------------------------
  #  De zelftest
  #
  #  Een kassa met een rekenfout brengt schade toe die je pas maanden
  #  later ziet. Dus draait de zelftest vóór er iets gepubliceerd wordt,
  #  en niet erna.
  # ------------------------------------------------------------------
  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Zelftest
        run: npm run selftest

  # ------------------------------------------------------------------
  #  Windows-installer
  # ------------------------------------------------------------------
  windows:
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Supabase-instellingen klaarzetten
        shell: bash
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Zet de secrets VITE_SUPABASE_URL en VITE_SUPABASE_ANON_KEY in de repo-instellingen."
            echo "::error::Zonder die twee bouwt hij een kassa waarin niemand kan inloggen."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env

      - name: Bouwen en publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --publish always

  # ------------------------------------------------------------------
  #  Android-APK
  # ------------------------------------------------------------------
  # De APK gaat er PAS bij als de Windows-baan klaar is, en dat is geen
  # netheid maar een fix.
  #
  # Allebei de banen hingen aan check en liepen dus tegelijk. Wie het eerst
  # klaar was, maakte de release aan -- en de ander liep stuk op
  # "Validation Failed: Release already_exists (tag_name)". Dat gebeurde bij
  # v0.19.1: de APK was in 2.5 minuut klaar, ruim voor de Windows-build, en
  # bleef daardoor buiten de release hangen terwijl de installer er wel in
  # kwam. Een halve release dus, en niemand die het merkt behalve wie de APK
  # zoekt.
  #
  # Het ging jarenlang goed omdat de APK meestal langzamer was dan de
  # Windows-build. Dat is timing, geen afspraak.
  #
  # Nu maakt de Windows-baan de release en hangt android er alleen nog iets
  # aan. Dat kost wachttijd, maar de Windows-build is toch de trage van de
  # twee, en een release die half aankomt is duurder dan een die vijf minuten
  # later compleet is.
  android:
    needs: [check, test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # JDK 21, niet nieuwer. Gradle 8.11 (die Capacitor meebrengt) kan geen
      # class files van JDK 25 lezen en stopt met "Unsupported class file major
      # version 69" -- een foutmelding die niet vertelt wat er aan de hand is.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencies installeren
        run: npm ci

      - name: Supabase-instellingen klaarzetten
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Zet de secrets VITE_SUPABASE_URL en VITE_SUPABASE_ANON_KEY in de repo-instellingen."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env

      # Staat het Android-project nog niet in de repo, dan maakt Capacitor het
      # hier aan. Beter is het om `npx cap add android` één keer lokaal te doen
      # en de map mee te committen: dan staan het pictogram en de
      # ondertekening vast in plaats van dat ze elke bouw opnieuw ontstaan.
      - name: Android-project klaarzetten
        run: |
          npm run build
          if [ ! -d android ]; then
            echo "android/ ontbreekt in de repo; Capacitor maakt het nu aan."
            npx cap add android
          fi
          node scripts/sync-android-version.cjs
          npx cap sync android

      # De XML nakijken vóór Gradle eraan begint.
      #
      # Een verboden `--` in een commentaar laat mergeResources omvallen met
      # een SAXParseException en een stapel Java eronder, na vier minuten
      # bouwen. Deze controle doet hetzelfde werk in een halve seconde en zegt
      # in welk bestand het zit.
      - name: XML van het Android-project nakijken
        run: python scripts/xml-nakijken.py

      # Het uitvoerrecht op gradlew overleeft een checkout vanaf Windows niet
      # altijd. Zonder dit recht stopt de bouw met code 126: bestand gevonden,
      # maar mag niet draaien.
      - name: Gradle-wrapper uitvoerbaar maken
        run: chmod +x android/gradlew

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK een nette naam geven
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Truckwash1-Kassa-${{ needs.check.outputs.version }}.apk"

      - name: Aan de release hangen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Truckwash1 Kassa ${{ needs.check.outputs.version }}
          draft: false
          files: out/*.apk
          body: |
            ## Downloaden

            **Windows-kassa** — pak `Truckwash1-Kassa-Setup-${{ needs.check.outputs.version }}.exe`,
            dubbelklik en volg de installatie. Updates komen daarna vanzelf binnen.

            **Android-tablet** — pak het `.apk`-bestand, zet het op het toestel
            en tik erop. Sta eenmalig "installeren uit onbekende bron" toe.

            ## Na het bijwerken

            Niets. De kassa haalt zijn artikelen, personeel en instellingen uit
            dezelfde database als de wasstraat-app; die staan er dus al. Bonnen
            die nog in de wachtrij stonden gaan na het opstarten alsnog de deur uit.

            > Deze APK is ondertekend met de standaard ontwikkelsleutel. Prima om
            > te installeren en te gebruiken; voor de Play Store is een eigen
            > keystore nodig.
